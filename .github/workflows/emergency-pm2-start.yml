# Emergency only: bring the site back without install/build.
# Use when production is down and console SSH is unreachable.
name: Emergency PM2 start

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: true

jobs:
  start:
    name: Start PM2 bloodline
    runs-on: ubuntu-latest
    steps:
      - name: Start app via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /var/www/bloodline-next

            pm2 delete bloodline || true
            # Clear a stuck listener from a crash loop (best-effort).
            fuser -k 3000/tcp || true
            sleep 1

            if [ ! -x node_modules/.bin/next ] && [ ! -f node_modules/next/dist/bin/next ]; then
              echo "next binary missing — run a full Deploy (npm ci) before emergency start can work"
              exit 1
            fi

            pm2 start npm --name bloodline --cwd /var/www/bloodline-next -- start
            pm2 save
            sleep 3
            pm2 status
            curl -fsS -o /dev/null -w "localhost_http=%{http_code}\n" --max-time 15 http://127.0.0.1:3000/
