name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/bloodline-next
            git fetch origin main
            git reset --hard origin/main
            npm ci --include=dev
            # Source files in public/ can change while /_next/image cache keys stay stale.
            rm -rf .next/cache/images
            npm run build
            pm2 restart bloodline
            pm2 save
