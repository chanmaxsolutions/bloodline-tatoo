# Production VPS deploy — runs ONLY on pushes to `main`.
# Client preview work should go to the `staging` branch (Vercel preview).
# Merge staging → main only after the client approves.
name: Deploy

on:
  push:
    branches:
      - main
  # Optional: run a production deploy manually from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/bloodline-next
            git fetch origin main
            git reset --hard origin/main
            npm ci --include=dev
            # Stop the app first so Next.js releases locks on .next/cache/images.
            pm2 stop bloodline || true
            # Source files in public/ can change while /_next/image cache keys stay stale.
            rm -rf .next/cache/images
            npm run build
            pm2 start bloodline || pm2 restart bloodline
            pm2 save
