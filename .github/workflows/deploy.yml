# Production VPS deploy — runs ONLY on pushes to `main`.
# Client preview work should go to the `staging` branch (Vercel preview).
# Merge staging → main only after the client approves.
name: Deploy

on:
  push:
    branches:
      - main
  # Optional: run a production deploy manually from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Large media pulls + npm ci + production build regularly exceed 10m.
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/bloodline-next
            git fetch origin main
            git reset --hard origin/main
            npm ci --include=dev
            # Keep the current release serving during install + build (ads / live traffic).
            npm run build
            # Brief cutover only after a successful build — seconds, not minutes.
            pm2 stop bloodline || true
            # Clear after stop so Next releases image-cache locks safely.
            rm -rf .next/cache/images
            pm2 start bloodline || pm2 restart bloodline
            pm2 save
