# Production VPS deploy — runs ONLY on pushes to `main`.
# Client preview work should go to the `staging` branch (Vercel preview).
# Merge staging → main only after the client approves.
#
# Downtime rules:
# - Keep the previous release serving during git/npm/build.
# - Restart PM2 only after a successful build (seconds of cutover).
# - Never leave the app stopped if build fails (set -e exits before restart).
name: Deploy

on:
  push:
    branches:
      - main
  # Optional: run a production deploy manually from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  # Do not cancel a live deploy mid-build — that can leave PM2 stopped.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # npm ci + next build on this VPS regularly needs more than 10m.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/bloodline-next

            # Repo may be owned by a different user after manual recovery / mixed sudo.
            git config --global --add safe.directory /var/www/bloodline-next
            # Deploy user must own the tree (no interactive sudo in Actions).
            # One-time on VPS if this fails: sudo chown -R "$(whoami):$(whoami)" /var/www/bloodline-next
            if [ ! -w .git ]; then
              echo "ERROR: .git is not writable by $(whoami). Fix ownership on the VPS, then re-run Deploy."
              ls -ld . .git || true
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            # Install + build while the previous PM2 process keeps serving traffic.
            npm ci --include=dev
            npm run build

            # Brief cutover only after a successful build.
            if pm2 describe bloodline >/dev/null 2>&1; then
              pm2 restart bloodline --update-env
            else
              pm2 start npm --name bloodline --cwd /var/www/bloodline-next -- start
            fi

            # Safe after the new process is up (avoids long offline image-cache clears).
            rm -rf .next/cache/images || true
            pm2 save

            # Fail the job if the app is not actually answering locally.
            sleep 3
            curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:3000/
            pm2 status
